name: Release v0.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.2.0.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ffbb7f02ef763116114dee634db3472dc7508c03
      RELEASE_TAG: v0.2.0
      RELEASE_VERSION: 0.2.0
      RELEASE_ISSUE: "33"
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${RELEASE_SHA}" ]]; then
            echo "Checked out ${actual_sha}, expected ${RELEASE_SHA}."
            exit 1
          fi
          python - <<'PY'
          import tomllib
          from pathlib import Path

          expected = "0.2.0"
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          assert project["name"] == "kepenk-gate"
          assert project["version"] == expected
          assert Path(f"docs/releases/v{expected}.md").is_file()
          print(f"verified release metadata: kepenk-gate=={expected}")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,release]"

      - name: Verify source quality and integration contracts
        run: |
          ruff check .
          mypy src/kepenk
          pytest
          python scripts/run_safety_demos.py
          pre-commit validate-manifest .pre-commit-hooks.yaml
          pre-commit validate-config .pre-commit-config.yaml
          pre-commit run kepenk-validate-local --all-files
          python scripts/validate_policy_examples.py

      - name: Build and verify release artifacts
        run: python scripts/verify_release_artifacts.py

      - name: Inspect release tag
        id: tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            remote_sha="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
            if [[ -z "${remote_sha}" ]]; then
              remote_sha="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
            fi
            if [[ "${remote_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Existing tag ${RELEASE_TAG} resolves to ${remote_sha}, expected ${RELEASE_SHA}."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at the verified release commit."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push annotated tag
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "Kepenk ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Kepenk ${RELEASE_TAG}" \
              --notes-file "docs/releases/${RELEASE_TAG}.md" \
              --verify-tag
          fi

      - name: Upload any missing verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for artifact in dist/*; do
            name="$(basename "${artifact}")"
            if printf '%s\n' "${existing_assets}" | grep -Fxq "${name}"; then
              echo "Asset ${name} already exists."
            else
              gh release upload "${RELEASE_TAG}" "${artifact}" --repo "${GITHUB_REPOSITORY}"
            fi
          done

      - name: Verify attached release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_dir="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${asset_dir}" \
            --pattern "kepenk_gate-${RELEASE_VERSION}-py3-none-any.whl" \
            --pattern "kepenk_gate-${RELEASE_VERSION}.tar.gz"

          wheel="${asset_dir}/kepenk_gate-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="${asset_dir}/kepenk_gate-${RELEASE_VERSION}.tar.gz"
          test -f "${wheel}"
          test -f "${sdist}"

          verify_artifact() {
            artifact="$1"
            environment="$(mktemp -d)/venv"
            python -m venv "${environment}"
            source "${environment}/bin/activate"
            python -m pip install --disable-pip-version-check "${artifact}"
            python - <<'PY'
          from importlib.metadata import version
          assert version("kepenk-gate") == "0.2.0"
          print("verified installed metadata: kepenk-gate==0.2.0")
          PY
            kepenk --help
            kepenk-pre-commit --help
            kepenk-mcp --help
            deactivate
          }

          verify_artifact "${wheel}"
          verify_artifact "${sdist}"

      - name: Verify release and close issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          printf '%s\n' "${assets}" | grep -Fxq "kepenk_gate-${RELEASE_VERSION}-py3-none-any.whl"
          printf '%s\n' "${assets}" | grep -Fxq "kepenk_gate-${RELEASE_VERSION}.tar.gz"

          gh issue close "${RELEASE_ISSUE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --reason completed \
            --comment "GitHub Release **${RELEASE_TAG}** verified successfully. The annotated tag resolves to \`${RELEASE_SHA}\`; the attached wheel and source distribution were downloaded, installed in clean environments, and passed metadata plus all three command-entry-point smoke tests: ${release_url}\n\nPublic PyPI publication remains separate and was not performed by this workflow."
