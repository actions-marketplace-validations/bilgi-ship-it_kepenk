name: Kepenk policy example

on:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - src/kepenk/github_action.py
      - examples/codex/kepenk.yaml
      - .github/workflows/kepenk-policy.yml

permissions:
  contents: read

jobs:
  validate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate example policy
        uses: ./
        with:
          mode: validate
          policy: examples/codex/kepenk.yaml

      - name: Check a read-only command
        id: check
        uses: ./
        with:
          mode: check
          policy: examples/codex/kepenk.yaml
          action_type: shell
          command: git status --short

      - name: Verify decision output
        shell: bash
        env:
          EFFECT: ${{ steps.check.outputs.effect }}
        run: test "$EFFECT" = "allow"
