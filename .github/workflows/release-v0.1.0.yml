name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 6739a651a1a09363be0c9f4cce469861688e65b1
      RELEASE_TAG: v0.1.0
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,release]"

      - name: Verify source quality
        run: |
          ruff check .
          mypy src/kepenk
          pytest

      - name: Build and verify release artifacts
        run: python scripts/verify_release_artifacts.py

      - name: Refuse to overwrite an existing tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to overwrite."
            exit 1
          fi

      - name: Create and push annotated tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "Kepenk ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub release with verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Kepenk ${RELEASE_TAG}" \
            --notes-file docs/releases/v0.1.0.md \
            --verify-tag
