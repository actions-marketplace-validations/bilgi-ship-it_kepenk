[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kepenk-gate"
version = "0.2.1"
description = "A deterministic approval and audit gate for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Samet Celikci" }
]
keywords = ["ai-agents", "codex", "guardrails", "policy", "security", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "cryptography>=44,<50",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "pytest>=8.3,<9",
  "jsonschema>=4.23,<5",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "mcp>=2,<3",
  "types-PyYAML>=6.0.12",
]
release = [
  "build>=1.2,<2",
  "twine>=6,<7",
]

[project.scripts]
kepenk = "kepenk.cli:main"
kepenk-pre-commit = "kepenk.pre_commit:main"
kepenk-mcp = "kepenk.mcp_server:main"

[project.urls]
Homepage = "https://github.com/bilgi-ship-it/kepenk"
Repository = "https://github.com/bilgi-ship-it/kepenk"
Issues = "https://github.com/bilgi-ship-it/kepenk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kepenk"]
